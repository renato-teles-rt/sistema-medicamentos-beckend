services:
  mysql-db:
    image: mysql:8.0
    container_name: medicacao_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: medicacao_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - cuidamed_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  cuidamed_mysql_data: